[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "pyGBZ2d"
version = "0.1.0"
description = "Brute-force generalized Brillouin zone (GBZ) computation for 2D non-Hermitian tight-binding models"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [
    { name = "wangchenyang", email = "cy-wang21@mails.tsinghua.edu.cn" },
]
keywords = ["non-hermitian", "skin effect", "GBZ", "amoeba", "tight-binding"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
